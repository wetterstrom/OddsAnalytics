name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Find Project and Inject API Secrets
        run: |
          PROJECT_FILE=$(find . -maxdepth 3 -name "*.csproj" | head -n 1)
          echo "Found project file: $PROJECT_FILE"
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          
          mkdir -p "$PROJECT_DIR/wwwroot"
          cat <<EOF > "$PROJECT_DIR/wwwroot/appsettings.json"
          {
            "ApiKeys": {
              "FootballApi": "${{ secrets.FOOTBALL_API_KEY }}",
              "OddsApi": "${{ secrets.ODDS_API_KEY }}"
            }
          }
          EOF

      - name: Publish Blazor WASM
        run: |
          PROJECT_FILE=$(find . -maxdepth 3 -name "*.csproj" | head -n 1)
          dotnet publish "$PROJECT_FILE" -c Release -o release -p:BlazorEnableCompression=false -p:WasmFingerprintAssets=false

      - name: Setup GitHub Pages files
        run: |
          touch release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages
