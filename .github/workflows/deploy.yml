name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Blazor WASM
        run: dotnet publish -c Release -o release

      - name: Fix Base Href, SPA Routing and Jekyll
        run: |
          touch release/wwwroot/.nojekyll
          sed -i 's|<base href="/" />|<base href="/OddsAnalytics/" />|g' release/wwwroot/index.html
          sed -i 's|<base href="./" />|<base href="/OddsAnalytics/" />|g' release/wwwroot/index.html
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Inject API Secrets into appsettings.json
        run: |
          cat <<EOF > release/wwwroot/appsettings.json
          {
            "ApiKeys": {
              "FootballApi": "${{ secrets.FOOTBALL_API_KEY }}",
              "OddsApi": "${{ secrets.ODDS_API_KEY }}"
            }
          }
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
