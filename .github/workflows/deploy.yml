name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Blazor WASM (utan komprimering)
        run: dotnet publish -c Release -o release -p:BlazorEnableCompression=false

      - name: Fix Jekyll, SPA Routing & Base Href
        run: |
          touch release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Inject API Secrets into appsettings.json
        run: |
          cat <<EOF > release/wwwroot/appsettings.json
          {
            "ApiKeys": {
              "FootballApi": "${{ secrets.FOOTBALL_API_KEY }}",
              "OddsApi": "${{ secrets.ODDS_API_KEY }}"
            }
          }
          EOF

      - name: Felsökning - Lista och verifiera publish-filer
        run: |
          echo "=== 1. Innehåll i release/wwwroot ==="
          ls -la release/wwwroot
          echo "=== 2. Finns .nojekyll? ==="
          ls -la release/wwwroot/.nojekyll
          echo "=== 3. Innehåll i _framework ==="
          ls -la release/wwwroot/_framework || true
          echo "=== 4. Sök efter blazor.webassembly.js ==="
          find release/wwwroot -name "*blazor.webassembly*" || true

      - name: Deploy till gh-pages grenen
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages
