name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WASM
        run: dotnet publish -c Release -o release -p:BlazorEnableCompression=false

      - name: Fix Fingerprinted Blazor Script & GitHub Pages Files
        run: |
          # 1. Skapa kopia av det hashade skriptet till det standardnamn index.html förväntar sig
          cp release/wwwroot/_framework/blazor.webassembly.*.js release/wwwroot/_framework/blazor.webassembly.js
          
          # 2. Skapa .nojekyll och 404-routing
          touch release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Inject API Secrets into appsettings.json
        run: |
          cat <<EOF > release/wwwroot/appsettings.json
          {
            "ApiKeys": {
              "FootballApi": "${{ secrets.FOOTBALL_API_KEY }}",
              "OddsApi": "${{ secrets.ODDS_API_KEY }}"
            }
          }
          EOF

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages
